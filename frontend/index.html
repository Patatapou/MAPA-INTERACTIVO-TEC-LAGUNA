<!DOCTYPE html>
<html lang="es">

<head>
    <title>Mapa Interactivo ITL</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El sitio es estático: todo se sirve desde el mismo origen. El enlace
         externo de sugerencias se abre con target="_blank" (navegación, no
         formulario ni fetch), por lo que la CSP no lo bloquea. -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <link rel="stylesheet" href="css/vendor/leaflet/leaflet.css">
    <script src="js/vendor/leaflet/leaflet.js"></script>
    <script src="data/GeoTec.js"></script>
    <link rel="stylesheet" href="css/public.css">
    <link rel="icon" type="image/x-icon" href="img/logo-tecnm.png">
</head>

<body>
    <div id="map"> </div>
    <div class="searchbar-container">
        <div class="searchbar-input-wrapper">
            <input type="text" id="searchbar-input" class="searchbar-input"
                placeholder="Buscar edificio o aula (ej: 19L, Edificio 19)..." autocomplete="off">
            <button type="button" class="searchbar-button" id="search-btn">🔍</button>
            <div id="searchbar-suggestions" class="searchbar-suggestions"></div>
        </div>
    </div>

    <div class="location-controls">
        <button type="button" id="center-location-btn" class="location-button">Centrar</button>
        <a id="admin-access-btn" class="location-button" href="#" target="_blank"
            rel="noopener noreferrer" title="Sugerir cambios" hidden>Sugerir cambios⚙️</a>
    </div>

    <!-- Panel de Puertas de Acceso (Esquina inferior izquierda) -->
    <div class="doors-panel-container">
        <label class="doors-panel-title" for="doors-select">Puertas de Acceso</label>
        <select id="doors-select" class="doors-select">
            <option value="" disabled selected>Selecciona una puerta...</option>
            <option value="P1">Puerta 1 (Norte - Gestión)</option>
            <option value="P2">Puerta 2 (Norte - Admin)</option>
            <option value="P3">Puerta 3 (Este - Alberca)</option>
            <option value="P4">Puerta 4 (Sur - Gimnasio)</option>
            <option value="P5">Puerta 5 (Sur - Béisbol)</option>
            <option value="P6">Puerta 6 (Oeste - Aulas)</option>
        </select>
    </div>

    <!-- Scripts Modulares (orden: shared → public) -->
    <script src="js/shared/dom-seguro.js"></script>
    <script src="js/shared/geo-utils.js"></script>
    <script src="js/public/beacons-simulation.js"></script>
    <script src="js/shared/pathfinding.js"></script>
    <script src="js/public/config.js"></script>
    <script src="js/public/main.js"></script>
</body>

</html>
