name: Verificar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Batería completa
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Instalar Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Ejecutar la verificación
        run: node scripts/verificar.mjs
